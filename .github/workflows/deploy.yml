name: Deploy to VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/Dayton_Capstone
            git fetch origin main
            git reset --hard origin/main
            git clean -fd -e admin-portal/.env -e admin-portal/venv -e 'admin-portal/ai_scripts/__pycache__'
            admin-portal/venv/bin/pip install -q -r admin-portal/ai_scripts/requirements.txt
            cd admin-portal && npm install --omit=dev --silent && cd ..
            sudo systemctl restart cqa-admin-portal
