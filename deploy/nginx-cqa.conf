# Reverse proxy: public :80 -> the Node app on 127.0.0.1:3000.
# Once you have a domain pointed at this VM's IP, run `sudo certbot --nginx`
# (after `sudo apt-get install certbot python3-certbot-nginx`) to add HTTPS —
# it rewrites this file to redirect :80 -> :443 automatically.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
